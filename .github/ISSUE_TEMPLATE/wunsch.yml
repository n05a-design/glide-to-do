name: Feature request / Wunsch oder Idee
description: Suggest an improvement / Eine Verbesserung vorschlagen
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Glide is intentionally a local, personal desktop app: no team features, built-in synchronization, mobile app, or built-in AI.
        Requests in those areas are outside the product scope; other ideas are welcome.

        Glide bleibt bewusst lokal und persönlich: keine Teamfunktionen, keine eigene Synchronisierung, keine Mobil-App und keine eingebaute KI.
        Wünsche in diese Richtungen lassen sich deshalb nicht umsetzen – alles andere gern!
  - type: textarea
    id: situation
    attributes:
      label: What situation are you in? / In welcher Situation fehlt dir etwas?
      description: Describe the situation, not the solution / Beschreibe den Alltag, nicht gleich die Lösung
    validations:
      required: true
  - type: textarea
    id: vorschlag
    attributes:
      label: What would help? / Was würde dir helfen?
    validations:
      required: true
  - type: textarea
    id: vorbild
    attributes:
      label: Have you seen this in another app? (optional) / Kennst du das aus einer anderen App? (optional)
