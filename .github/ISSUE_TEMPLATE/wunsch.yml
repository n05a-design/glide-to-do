name: Wunsch oder Idee / Feature request
description: Eine Verbesserung vorschlagen / Suggest an improvement
title: "[Wunsch/Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Glide bleibt bewusst lokal und persönlich: keine Teamfunktionen, keine eigene Synchronisierung, keine Mobil-App und keine eingebaute KI.
        Wünsche in diese Richtungen lassen sich deshalb nicht umsetzen – alles andere gern!

        Glide is intentionally a local, personal desktop app: no team features, built-in synchronization, mobile app, or built-in AI.
        Requests in those areas are outside the product scope; other ideas are welcome.
  - type: textarea
    id: situation
    attributes:
      label: In welcher Situation fehlt dir etwas? / What situation are you in?
      description: Beschreibe den Alltag, nicht gleich die Lösung / Describe the situation, not the solution
    validations:
      required: true
  - type: textarea
    id: vorschlag
    attributes:
      label: Was würde dir helfen? / What would help?
    validations:
      required: true
  - type: textarea
    id: vorbild
    attributes:
      label: Kennst du das aus einer anderen App? (optional) / Have you seen this in another app? (optional)
