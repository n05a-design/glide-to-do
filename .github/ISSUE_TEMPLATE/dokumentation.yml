name: Dokumentationsfehler / Documentation issue
description: Fehler, veraltete Texte oder fehlende Hinweise melden / Report outdated or missing documentation
title: "[Dokumentation] "
body:
  - type: markdown
    attributes:
      value: |
        Bitte nur dokumentationsbezogene Befunde melden. / Please report documentation-only findings.
  - type: textarea
    id: betroffener-bereich
    attributes:
      label: Betroffener Bereich / Affected area
      description: Datei, Abschnitt oder GitHub-Seite / File, section or GitHub page
    validations:
      required: true
  - type: textarea
    id: erwartung
    attributes:
      label: Erwarteter Inhalt / Expected content
      description: Was sollte stimmen oder fehlen? / What should be correct or present?
    validations:
      required: true
  - type: textarea
    id: istzustand
    attributes:
      label: Aktueller Text / Current text
      description: Verlinkung oder kurzer Wortlaut / Link or short quote
  - type: checkboxes
    id: pruefung
    attributes:
      label: Prüfung / Verification
      options:
        - label: Ich habe geprüft, ob die Ursache bereits in einer historischen oder neuen Dokumentversion anders beschrieben wird. / I checked whether history or a newer document describes this differently.
