name: Barrierefreiheit / Accessibility
description: Tastatur, Fokus, Kontrast, Schrift, Reader oder Bedienbarkeit melden / Report keyboard, focus, contrast, font or reader issues
title: "[Accessibility] "
body:
  - type: dropdown
    id: bereich
    attributes:
      label: Betroffener Bereich / Affected area
      options:
        - Tastatur und Fokus / Keyboard and focus
        - Großschrift oder Skalierung / Large text or scaling
        - Kontrast oder Farbraum / Contrast or color
        - Screenreader / Screen reader
        - Maus oder Touch / Mouse or touch
        - Anderer Bereich / Other area
    validations:
      required: true
  - type: textarea
    id: erwartung
    attributes:
      label: Erwartete Bedienung / Expected interaction
    validations:
      required: true
  - type: textarea
    id: reproduktion
    attributes:
      label: Reproduktion / Reproduction
      description: Schritte, Komponente, System und assistive Technologie. / Steps, component, OS and assistive technology.
    validations:
      required: true
  - type: textarea
    id: umgebung
    attributes:
      label: Umgebung / Environment
      description: Glide-Version, Betriebssystem, Fenstergröße und Schriftgröße. / Glide version, OS, window size and text size.
