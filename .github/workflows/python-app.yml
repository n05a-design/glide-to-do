# Glide-Prüfung (D09, CI-Grundstufe)
#
# Ersetzt die GitHub-Vorlage „Python application“. Deren `pytest` sammelte das
# ganze Repository ein: Archivkopien mit Punkten im Dateinamen, Altstände in
# 50_Ablage und die Integrationssuiten, die schon beim Import ein Tk-Fenster
# öffnen. Glides Prüfungen laufen über die eigenen Werkzeuge in
# 01_Repository/Glide/tests/tools; sie brauchen nur die Standardbibliothek.
#
# Grundstufe (jeder Push und Pull Request auf main): ci_grundstufe.py –
# Syntax, Versionen, Dokumentationsindex, Fixtures, Werkzeug- und Unit-Tests,
# fünf Analysen, Startprobe unter Xvfb, Lieferstand als Hinweis.
#
# Integrationssuiten (nur manuell über „Run workflow“): pruefen.py unter
# Linux/Tk 8.6. Die Suiten sind auf den Referenz-Mac abgestimmt; Abweichungen
# bei Schriftmetrik und Layout sind dort erwartbar. Der Job ist informativ und
# ersetzt nicht die Vollprüfung auf dem Mac.

name: Glide-Prüfung

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      integrationssuiten:
        description: "Zusätzlich alle Integrationssuiten unter Linux/Xvfb ausführen (informativ, rund 45 Minuten)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: glide-pruefung-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  grundstufe:
    name: Grundstufe (Linux, Python 3.14, Tk 8.6)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 01_Repository/Glide
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Xvfb und Tk für die Startprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libtk8.6

      - name: CI-Grundstufe
        run: python -B tests/tools/ci_grundstufe.py --protokoll "$RUNNER_TEMP/grundstufe"

      - name: Protokolle sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grundstufe-protokolle
          path: ${{ runner.temp }}/grundstufe
          retention-days: 14
          if-no-files-found: ignore

  integrationssuiten-linux:
    name: Integrationssuiten (Linux/Xvfb, informativ)
    if: github.event_name == 'workflow_dispatch' && inputs.integrationssuiten
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    defaults:
      run:
        working-directory: 01_Repository/Glide
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Xvfb, Tk und ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libtk8.6 imagemagick

      - name: Prüfstand im Schnellmodus
        run: python -B tests/tools/pruefen.py --modus schnell --protokoll "$RUNNER_TEMP/integration" --timeout 900

      - name: Protokolle sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrationssuiten-linux
          path: ${{ runner.temp }}/integration
          retention-days: 14
          if-no-files-found: ignore
