# Glide-Paket Windows x64 (Pakete 7/8, D27/D36): eigenständiges Entwicklungspaket
# ohne installiertes Python. Unsigniertes Entwicklungsartefakt; Integrität über
# Paket- und Quellhashes. 06.11.2026 aus python-app.yml ausgelagert, damit
# Vollmatrix (python-app.yml) und Release-Entwurf (release.yml) denselben Bau
# aufrufen. Schritte unverändert übernommen. Öffentliche Signatur bleibt Tor I3.
name: Glide-Paket Windows x64

on:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  paket-windows:
    name: Eigenständiges Paket (Windows x64, PyInstaller 6.22.3)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: 01_Repository/Glide/packaging/paket
    steps:
      - name: Lange Git-Pfade zulassen
        working-directory: ${{ github.workspace }}
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        id: python
        with:
          python-version: "3.14.7"
          architecture: x64
      - name: Originalquellen der eigenen Tk-9.1-Laufzeit
        run: python -B ../runtime/hole_runtimequellen.py --ziel "$env:RUNNER_TEMP/paket-quellen"
      - name: Eigene geprüfte Tk-9.1-Laufzeit für das eigenständige Paket
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Native x64-MSVC-Bauumgebung fehlt" }
          $devcmd = Join-Path $vs "Common7/Tools/VsDevCmd.bat"
          cmd /s /c "`"$devcmd`" -arch=x64 -host_arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Set-Item "Env:$($matches[1])" $matches[2] }
          }
          python -B ../runtime/baue_runtime.py --tcl-quelle "$env:RUNNER_TEMP/paket-quellen/tcl" --tk-quelle "$env:RUNNER_TEMP/paket-quellen/tk" --python-quelle "$env:RUNNER_TEMP/paket-quellen/python" --ziel "$env:RUNNER_TEMP/paket-runtime"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_ENV -Value "PYTHONPATH=$env:RUNNER_TEMP/paket-runtime/python-extension"
      - name: Gepinnte Bauabhängigkeiten in eigener Umgebung
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/paket" | Out-Null
          python -m venv "$env:RUNNER_TEMP/bau-venv"
          & "$env:RUNNER_TEMP/bau-venv/Scripts/python.exe" -m pip install --disable-pip-version-check -r ../../requirements/build-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/bau-venv/Scripts/python.exe" -m pip freeze --all > "$env:RUNNER_TEMP/paket/bauabhaengigkeiten.txt"
      - name: Lizenzbestand aus der Baulaufzeit
        run: |
          & "$env:RUNNER_TEMP/bau-venv/Scripts/python.exe" -B lizenzen_vorbereiten_windows.py --quelle ../../src/glide --repo ../.. --ziel "$env:RUNNER_TEMP/paket/lizenzen" --runtime-bau "$env:RUNNER_TEMP/paket-runtime/runtime-bau.json"
          exit $LASTEXITCODE
      - name: Nativer Paketbau
        run: |
          $version = (Get-Content ../../VERSION -Raw).Trim()
          & "$env:RUNNER_TEMP/bau-venv/Scripts/python.exe" -B baue_paket.py --quelle ../../src/glide --version $version --ziel "$env:RUNNER_TEMP/paket/bau" --plattform windows-x64 --lizenzen "$env:RUNNER_TEMP/paket/lizenzen" --runtime-bau "$env:RUNNER_TEMP/paket-runtime/runtime-bau.json"
          exit $LASTEXITCODE
      - name: Native ACL-Restaurierung an Symlinks
        # Vor der Sperre: Restaurierer am eigenen temporären Ordner mit Dateisymlink.
        run: python -B -m unittest discover -s ../../tests/tools -p test_paket_windows_isolation.py -v
      - name: Isolierte Startprobe ohne externes Python
        run: |
          $python = Split-Path -Parent "${{ steps.python.outputs.python-path }}"
          python -B pruefe_start_windows.py --paket "$env:RUNNER_TEMP/paket/bau/dist/Glide" --bericht "$env:RUNNER_TEMP/paket/startprobe.json" --sperren $python --sperren "$env:RUNNER_TEMP/bau-venv" --sperren "$env:RUNNER_TEMP/paket-runtime" --sperren "$env:RUNNER_TEMP/paket/bau/quelle" --sperren "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE
      - name: Bau- und Startbelege sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: paket-windows-belege
          path: |
            ${{ runner.temp }}/paket-runtime/runtime-bau.json
            ${{ runner.temp }}/paket-runtime/protokolle
            ${{ runner.temp }}/paket/*.json
            ${{ runner.temp }}/paket/*.txt
            ${{ runner.temp }}/paket/lizenzen/manifest.json
            ${{ runner.temp }}/paket/bau/*.json
            ${{ runner.temp }}/paket/bau/bau.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Paket sichern (unsigniertes Entwicklungsartefakt)
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: paket-windows-glide
          path: ${{ runner.temp }}/paket/bau/dist/Glide
          retention-days: 14
